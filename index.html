<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SAMM VIP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #050b14; --bg2: #0b1220; --bg3: #101a2d;
    --text: #f8fbff; --text2: #9eb3cc; --red: #ff4d6d; --green: #00e5a0; --cyan: #00d4ff;
    --border: rgba(255,255,255,0.06); --border2: rgba(255,255,255,0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  /* CSS cho màn hình loading */
  #loadingScreen { position: fixed; inset: 0; background: #050505; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s; }
  .loader { width: 50px; height: 50px; border: 3px solid rgba(255, 51, 85, 0.2); border-top: 3px solid var(--red); border-radius: 50%; animation: spinR 1s linear infinite; margin-bottom: 15px; }
  @keyframes spinR { to { transform: rotate(360deg); } }
  .loading-text { color: var(--red); font-size: 14px; font-weight: 700; letter-spacing: 1px; }

  /* Giao diện chính */
  #mainApp { display: none; height: 100%; flex-direction: column; }
  .header { padding: 15px 20px; background: var(--bg2); border-bottom: 1px solid var(--border2); display: flex; justify-content: space-between; align-items: center; }
  .header-title { font-size: 20px; font-weight: 900; color: #fff; text-shadow: 0 0 10px var(--red); }
  .header-title span { color: var(--red); }
  .btn-logout { background: transparent; border: 1px solid var(--red); color: var(--red); padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; }
  
  .main-content { flex: 1; overflow-y: auto; padding: 20px; }
  
  /* Màn hình nhập Key */
  .welcome-box { background: var(--bg2); border: 1px solid var(--border2); border-radius: 16px; padding: 30px 20px; text-align: center; margin-top: 50px; }
  .welcome-box h2 { color: var(--cyan); margin-bottom: 10px; }
  .welcome-box p { color: var(--text2); font-size: 13px; margin-bottom: 20px; }
  .key-input { width: 100%; padding: 15px; background: #000; border: 1px solid var(--border2); border-radius: 10px; color: #fff; font-size: 16px; text-align: center; margin-bottom: 15px; outline: none; text-transform: uppercase; }
  .key-input:focus { border-color: var(--green); }
  .btn-activate { width: 100%; padding: 15px; background: linear-gradient(135deg, var(--red), #aa0022); border: none; border-radius: 10px; color: #fff; font-size: 16px; font-weight: 900; cursor: pointer; }
  
  /* Khu vực hiển thị tính năng khi đã có key */
  .feature-card { background: var(--bg3); border: 1px solid var(--border2); border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .feature-info h3 { font-size: 15px; margin-bottom: 5px; }
  .feature-info p { font-size: 12px; color: var(--text2); }
  .toggle { width: 40px; height: 20px; background: #333; border-radius: 20px; position: relative; cursor: pointer; }
  .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: 0.3s; }
  .toggle.active { background: var(--green); }
  .toggle.active::after { transform: translateX(20px); }
  
  .msg-box { padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; font-size: 13px; font-weight: bold; display: none; }
  .msg-err { background: rgba(255,51,85,0.1); color: var(--red); border: 1px solid var(--red); display: block; }
  .msg-ok { background: rgba(0,229,160,0.1); color: var(--green); border: 1px solid var(--green); display: block; }
</style>
</head>
<body>

<!-- Màn hình chờ -->
<div id="loadingScreen">
  <div class="loader"></div>
  <div class="loading-text">Đang khởi tạo SAMM VIP...</div>
</div>

<!-- Giao diện chính -->
<div id="mainApp">
  <div class="header">
    <div class="header-title">SAMM<span> VIP</span></div>
    <button class="btn-logout" onclick="logoutKey()" id="btnLogout" style="display:none;">Đăng Xuất</button>
  </div>

  <div class="main-content">
    
    <!-- KHU VỰC CHƯA KÍCH HOẠT -->
    <div id="authArea" class="welcome-box">
      <h2>Nhập Key Bản Quyền</h2>
      <p>Vui lòng nhập key hợp lệ để sử dụng ứng dụng.</p>
      <div id="msgBox" class="msg-box"></div>
      <input type="text" id="keyInput" class="key-input" placeholder="SAM-XXXX-XXXX-XXXX">
      <button class="btn-activate" id="btnActivate" onclick="activateKey()">KÍCH HOẠT NGAY</button>
    </div>

    <!-- KHU VỰC ĐÃ KÍCH HOẠT (TÍNH NĂNG) -->
    <div id="appArea" style="display:none;">
      <div style="text-align:center; margin-bottom:20px;">
        <h2 style="color:var(--green);"><i class="fa-solid fa-check-circle"></i> Đã Kích Hoạt</h2>
        <p style="color:var(--text2); font-size:13px;" id="keyInfoDisplay">Hạng: ...</p>
      </div>
      
      <div class="feature-card">
        <div class="feature-info"><h3>Aimlock Pro</h3><p>Khóa mục tiêu tự động</p></div>
        <div class="toggle" onclick="this.classList.toggle('active')"></div>
      </div>
      <div class="feature-card">
        <div class="feature-info"><h3>ESP / Xuyên Tường</h3><p>Nhìn thấy địch xuyên vật thể</p></div>
        <div class="toggle" onclick="this.classList.toggle('active')"></div>
      </div>
      <div class="feature-card">
        <div class="feature-info"><h3>Antiban Protect</h3><p>Chống quét hệ thống</p></div>
        <div class="toggle" onclick="this.classList.toggle('active')"></div>
      </div>
    </div>

  </div>
</div>

<script>
// ⚠️ SỬA LINK NÀY THÀNH LINK RENDER CỦA BẠN (Hoặc localhost nếu chạy thử)
const SERVER_URL = "https://ten-server-render-cua-ban.onrender.com"; 

// Tạo ID thiết bị ngẫu nhiên lưu trên máy
function getDeviceId() {
  let id = localStorage.getItem('samm_device_id');
  if(!id) {
    id = 'DEV-' + Math.random().toString(36).substr(2, 8).toUpperCase();
    localStorage.setItem('samm_device_id', id);
  }
  return id;
}
const DEVICE_ID = getDeviceId();

// Ẩn màn hình chờ sau 1.2s (Không phụ thuộc vào server)
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    const loader = document.getElementById('loadingScreen');
    if(loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 500); }
    document.getElementById('mainApp').style.display = 'flex';
    
    // Kiểm tra xem máy đã từng nhập key chưa
    const savedKey = localStorage.getItem('samm_saved_key');
    if(savedKey) {
      verifyKey(savedKey, true);
    }
  }, 1200);
});

function showMsg(text, isOk) {
  const box = document.getElementById('msgBox');
  box.innerHTML = text;
  box.className = 'msg-box ' + (isOk ? 'msg-ok' : 'msg-err');
  setTimeout(() => box.className = 'msg-box', 4000);
}

async function activateKey() {
  const key = document.getElementById('keyInput').value.trim();
  if(!key) return showMsg('Vui lòng nhập Key!', false);
  
  const btn = document.getElementById('btnActivate');
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang kiểm tra...';
  btn.disabled = true;

  await verifyKey(key, false);
  
  btn.innerHTML = 'KÍCH HOẠT NGAY';
  btn.disabled = false;
}

async function verifyKey(key, isAutoLogin) {
  try {
    const res = await fetch(SERVER_URL + '/api/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: key, deviceId: DEVICE_ID })
    });
    
    const data = await res.json();
    
    if(data.ok) {
      // Lưu key vào máy để lần sau không phải nhập lại
      localStorage.setItem('samm_saved_key', key);
      
      if(!isAutoLogin) showMsg('<i class="fa-solid fa-check"></i> Kích hoạt thành công!', true);
      
      // Chuyển sang giao diện sử dụng
      setTimeout(() => {
        document.getElementById('authArea').style.display = 'none';
        document.getElementById('appArea').style.display = 'block';
        document.getElementById('btnLogout').style.display = 'block';
        
        let timeStr = data.isForever ? 'Vĩnh Viễn' : new Date(data.expiresAt).toLocaleString('vi-VN');
        document.getElementById('keyInfoDisplay').innerHTML = `Hạng: <b>${data.name}</b> | Hết hạn: <b>${timeStr}</b>`;
      }, 500);
      
    } else {
      if(isAutoLogin) {
        // Nếu tự động login mà key lỗi (hết hạn/bị xóa) thì xóa đi bắt nhập lại
        localStorage.removeItem('samm_saved_key');
      } else {
        showMsg('<i class="fa-solid fa-xmark"></i> ' + data.error, false);
      }
    }
  } catch(e) {
    if(!isAutoLogin) showMsg('<i class="fa-solid fa-wifi"></i> Lỗi kết nối đến Server!', false);
  }
}

function logoutKey() {
  if(!confirm('Bạn có chắc muốn đăng xuất? (Sẽ xóa key đã lưu trên thiết bị này)')) return;
  localStorage.removeItem('samm_saved_key');
  location.reload();
}
</script>
</body>
</html>
